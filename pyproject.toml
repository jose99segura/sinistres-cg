[project]
name = "sinistres"
version = "0.1.0"
description = "Is this claim covered? Answers from home-insurance general conditions, with cited clauses."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pymupdf>=1.25",
    "pyyaml>=6.0",
]

[project.scripts]
sinistres = "sinistres.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
