# The contracts the app knows about. One entry = one row of the `contracts` table.
# PDFs are public documents downloaded from each insurer's website; they are not committed.
# `product_key` groups the editions of one product; `effective` is the date an edition starts to apply,
# so a claim is judged against the edition in force on the date of loss (db.contract_in_force).
# `pages` limits ingestion to the home-insurance chapters of multi-line contracts (1-based PDF pages).
contracts:
  - id: baloise-home-2024
    product_key: baloise-home
    insurer: Baloise Luxembourg
    product: HOME
    version: CG-HOME(2)-LUFR-09-24
    effective: "2024-09"
    url: https://www.baloise.lu/dam/baloise-lu/1890/particulier/documents/CG-CS/CG-HOME-2--LUFR-09-24.pdf
    sha256: 2c365b0ea59a47ddf86295b0e1ad65a0c23847bcc30db22ec47861b18ba4a5a6
    pages: null

